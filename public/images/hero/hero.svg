<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="45%" stop-color="#141419"/>
      <stop offset="75%" stop-color="#211b15"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="68%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#6e5738" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="50%" stop-color="#25252b"/>
      <stop offset="100%" stop-color="#161619"/>
    </linearGradient>
    <linearGradient id="woodPanels" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3b2c"/>
      <stop offset="50%" stop-color="#34281c"/>
      <stop offset="100%" stop-color="#241a12"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5db" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5d79e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#cca05d" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3438" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#142224" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1718"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e5be" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f7e5be" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Distant Stars / Night Sparkles -->
  <circle cx="180" cy="120" r="1.5" fill="#f3efe6" fill-opacity="0.5"/>
  <circle cx="340" cy="80" r="1" fill="#f3efe6" fill-opacity="0.4"/>
  <circle cx="520" cy="160" r="1.5" fill="#f3efe6" fill-opacity="0.6"/>
  <circle cx="790" cy="90" r="2" fill="#c4a574" fill-opacity="0.7"/>
  <circle cx="980" cy="140" r="1" fill="#f3efe6" fill-opacity="0.4"/>
  <circle cx="1200" cy="70" r="1.5" fill="#f3efe6" fill-opacity="0.5"/>
  <circle cx="1450" cy="130" r="2" fill="#f3efe6" fill-opacity="0.6"/>
  <circle cx="1320" cy="200" r="1" fill="#c4a574" fill-opacity="0.5"/>

  <!-- Ambient Horizon Glow behind Architecture -->
  <rect x="0" y="200" width="1600" height="700" fill="url(#glowWarm)"/>

  <!-- Distant Landscape / Trees Silhouette -->
  <path d="M0 640 Q180 630 350 638 Q600 645 850 635 Q1200 625 1600 635 V900 H0 Z" fill="#0d0d0f"/>
  <path d="M1200 635 C1240 590 1280 580 1310 635 M1320 635 C1350 560 1400 550 1440 635 M1460 635 C1490 580 1530 575 1570 635 M80 640 C110 570 160 560 200 640 M220 640 C250 590 290 585 330 640" stroke="#0d0d0f" stroke-width="12" stroke-linecap="round" fill="#0d0d0f"/>

  <!-- Luxury Modern Residence (Right & Center) -->
  <!-- Upper Cantilever Box -->
  <rect x="680" y="320" width="620" height="210" rx="4" fill="url(#wallDark)" stroke="#3a3a44" stroke-width="1"/>
  <!-- Upper Wood Slats Accent Feature -->
  <rect x="680" y="320" width="160" height="210" fill="url(#woodPanels)"/>
  <line x1="710" y1="320" x2="710" y2="530" stroke="#1f1810" stroke-width="2"/>
  <line x1="740" y1="320" x2="740" y2="530" stroke="#1f1810" stroke-width="2"/>
  <line x1="770" y1="320" x2="770" y2="530" stroke="#1f1810" stroke-width="2"/>
  <line x1="800" y1="320" x2="800" y2="530" stroke="#1f1810" stroke-width="2"/>

  <!-- Upper Glass Panorama Window Wall -->
  <rect x="880" y="350" width="380" height="150" rx="3" fill="url(#windowGlow)" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Window mullions -->
  <line x1="975" y1="350" x2="975" y2="500" stroke="#1e1e24" stroke-width="3"/>
  <line x1="1070" y1="350" x2="1070" y2="500" stroke="#1e1e24" stroke-width="3"/>
  <line x1="1165" y1="350" x2="1165" y2="500" stroke="#1e1e24" stroke-width="3"/>

  <!-- Interior Architectural Silhouette / Curtains / Art -->
  <rect x="910" y="380" width="40" height="60" rx="2" fill="#523d24" fill-opacity="0.6"/>
  <circle cx="1020" cy="400" r="16" fill="#cca05d" fill-opacity="0.4"/>
  <line x1="1020" y1="350" x2="1020" y2="390" stroke="#cca05d" stroke-width="1"/>

  <!-- Lower Ground Floor Structure (Wider, offset) -->
  <rect x="560" y="490" width="820" height="180" rx="4" fill="#18181c" stroke="#2d2d35" stroke-width="1.2"/>

  <!-- Ground Floor Master Glass Living Room -->
  <rect x="620" y="520" width="440" height="150" fill="url(#windowGlow)" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="730" y1="520" x2="730" y2="670" stroke="#161619" stroke-width="4"/>
  <line x1="840" y1="520" x2="840" y2="670" stroke="#161619" stroke-width="4"/>
  <line x1="950" y1="520" x2="950" y2="670" stroke="#161619" stroke-width="4"/>

  <!-- Lower Exterior Pergola / Outdoor Lounge -->
  <rect x="1080" y="510" width="260" height="20" fill="#2d2218"/>
  <line x1="1120" y1="530" x2="1120" y2="670" stroke="#3d3024" stroke-width="6"/>
  <line x1="1220" y1="530" x2="1220" y2="670" stroke="#3d3024" stroke-width="6"/>
  <line x1="1320" y1="530" x2="1320" y2="670" stroke="#3d3024" stroke-width="6"/>

  <!-- Light Cones / Wall Sconces -->
  <polygon points="690,320 670,420 710,420" fill="url(#lightBeam)"/>
  <polygon points="850,320 830,420 870,420" fill="url(#lightBeam)"/>
  <polygon points="580,490 560,600 600,600" fill="url(#lightBeam)"/>
  <polygon points="1070,490 1050,600 1090,600" fill="url(#lightBeam)"/>

  <!-- Paved Terrace & Swimming Pool -->
  <polygon points="460,670 1480,670 1560,820 340,820" fill="#131316" stroke="#2a2a30" stroke-width="1"/>
  
  <!-- Modern Pool (Mirroring light) -->
  <polygon points="720,700 1340,700 1390,795 660,795" fill="url(#poolGrad)" stroke="#c4a574" stroke-width="1.2" stroke-opacity="0.3"/>
  <!-- Pool warm water reflection streaks -->
  <ellipse cx="960" cy="740" rx="180" ry="12" fill="#cca05d" fill-opacity="0.22"/>
  <ellipse cx="1020" cy="765" rx="120" ry="8" fill="#dfc298" fill-opacity="0.28"/>

  <!-- Modern Garden Bollard Path Lights -->
  <circle cx="520" cy="720" r="3.5" fill="#fdf2d8"/>
  <polygon points="520,720 500,770 540,770" fill="url(#lightBeam)"/>
  <line x1="520" y1="720" x2="520" y2="735" stroke="#3a3228" stroke-width="3"/>

  <circle cx="600" cy="755" r="3.5" fill="#fdf2d8"/>
  <polygon points="600,755 580,805 620,805" fill="url(#lightBeam)"/>
  <line x1="600" y1="755" x2="600" y2="770" stroke="#3a3228" stroke-width="3"/>

  <!-- Foreground Elegant Foliage / Trees -->
  <path d="M1420 900 C1400 780 1410 680 1435 600 C1450 560 1480 570 1490 610 C1510 690 1520 780 1500 900 Z" fill="#0b0b0d"/>
  <path d="M1480 620 C1540 600 1580 630 1560 670 C1530 720 1480 700 1480 620 Z" fill="#0d0d10"/>
  <path d="M260 900 C270 800 250 720 230 650 C220 620 240 610 250 630 C270 700 290 800 300 900 Z" fill="#0b0b0d"/>

  <!-- Bottom Vignette Gradient -->
  <rect x="0" y="650" width="1600" height="250" fill="url(#glowWarm)" opacity="0.4"/>
</svg>
