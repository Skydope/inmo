<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="h2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111218"/>
      <stop offset="60%" stop-color="#221e25"/>
      <stop offset="100%" stop-color="#36281e"/>
    </linearGradient>
    <linearGradient id="h2Brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a281e"/>
      <stop offset="50%" stop-color="#5a3124"/>
      <stop offset="100%" stop-color="#3e2017"/>
    </linearGradient>
    <linearGradient id="h2Glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#f5d38f"/>
      <stop offset="100%" stop-color="#cc9746"/>
    </linearGradient>
    <linearGradient id="h2Patio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33241c"/>
      <stop offset="100%" stop-color="#1f1611"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#h2Sky)"/>
  <circle cx="850" cy="120" r="1.5" fill="#f3efe6" opacity="0.6"/>
  <circle cx="980" cy="90" r="2" fill="#c4a574" opacity="0.5"/>

  <!-- Neighboring building walls (PH setting) -->
  <rect x="0" y="240" width="220" height="560" fill="#1c1c20" stroke="#2a2a30" stroke-width="1"/>
  <rect x="980" y="200" width="220" height="600" fill="#1a1a1d" stroke="#2a2a30" stroke-width="1"/>

  <!-- Restored Brick Wall Façade of the PH -->
  <rect x="220" y="280" width="760" height="340" fill="url(#h2Brick)" stroke="#2b1610" stroke-width="2"/>
  
  <!-- Brick Texture Lines -->
  <g stroke="#321b14" stroke-width="1.2" opacity="0.5">
    <line x1="220" y1="310" x2="980" y2="310"/>
    <line x1="220" y1="340" x2="980" y2="340"/>
    <line x1="220" y1="370" x2="980" y2="370"/>
    <line x1="220" y1="400" x2="980" y2="400"/>
    <line x1="220" y1="430" x2="980" y2="430"/>
    <line x1="220" y1="460" x2="980" y2="460"/>
    <line x1="220" y1="490" x2="980" y2="490"/>
    <line x1="220" y1="520" x2="980" y2="520"/>
    <line x1="220" y1="550" x2="980" y2="550"/>
    <line x1="220" y1="580" x2="980" y2="580"/>
  </g>

  <!-- Large Recycled Industrial Iron French Doors with Arch Top -->
  <!-- Left Window / Door -->
  <path d="M300 370 C300 330 380 330 380 370 V610 H300 Z" fill="url(#h2Glow)" stroke="#161616" stroke-width="5"/>
  <line x1="340" y1="335" x2="340" y2="610" stroke="#161616" stroke-width="3"/>
  <line x1="300" y1="440" x2="380" y2="440" stroke="#161616" stroke-width="3"/>
  <line x1="300" y1="520" x2="380" y2="520" stroke="#161616" stroke-width="3"/>

  <!-- Center Double Glass Doors -->
  <path d="M460 350 C460 310 660 310 660 350 V610 H460 Z" fill="url(#h2Glow)" stroke="#161616" stroke-width="5"/>
  <line x1="560" y1="315" x2="560" y2="610" stroke="#161616" stroke-width="4"/>
  <line x1="460" y1="410" x2="660" y2="410" stroke="#161616" stroke-width="3"/>
  <line x1="460" y1="490" x2="660" y2="490" stroke="#161616" stroke-width="3"/>
  <line x1="460" y1="560" x2="660" y2="560" stroke="#161616" stroke-width="3"/>
  <!-- Gold handles -->
  <line x1="550" y1="480" x2="550" y2="510" stroke="#c4a574" stroke-width="3"/>
  <line x1="570" y1="480" x2="570" y2="510" stroke="#c4a574" stroke-width="3"/>

  <!-- Right Window -->
  <path d="M740 370 C740 330 820 330 820 370 V610 H740 Z" fill="url(#h2Glow)" stroke="#161616" stroke-width="5"/>
  <line x1="780" y1="335" x2="780" y2="610" stroke="#161616" stroke-width="3"/>
  <line x1="740" y1="440" x2="820" y2="440" stroke="#161616" stroke-width="3"/>
  <line x1="740" y1="520" x2="820" y2="520" stroke="#161616" stroke-width="3"/>

  <!-- Private Patio Courtyard (Foreground) -->
  <polygon points="120,610 1080,610 1200,800 0,800" fill="url(#h2Patio)"/>
  <!-- Terracotta Tile Grid -->
  <line x1="220" y1="610" x2="100" y2="800" stroke="#251a14" stroke-width="2"/>
  <line x1="420" y1="610" x2="360" y2="800" stroke="#251a14" stroke-width="2"/>
  <line x1="620" y1="610" x2="620" y2="800" stroke="#251a14" stroke-width="2"/>
  <line x1="820" y1="610" x2="880" y2="800" stroke="#251a14" stroke-width="2"/>
  <line x1="1020" y1="610" x2="1140" y2="800" stroke="#251a14" stroke-width="2"/>
  <line x1="80" y1="660" x2="1120" y2="660" stroke="#251a14" stroke-width="2"/>
  <line x1="40" y1="720" x2="1160" y2="720" stroke="#251a14" stroke-width="2.5"/>

  <!-- Outdoor String Festoon Lights across Patio -->
  <path d="M220 320 Q440 370 660 330 Q820 370 980 320" stroke="#333" stroke-width="1.8" fill="none"/>
  <!-- Glowing Bulbs -->
  <circle cx="300" cy="343" r="5" fill="#ffe3a3"/>
  <circle cx="300" cy="343" r="14" fill="#ffe3a3" fill-opacity="0.25"/>
  <circle cx="420" cy="358" r="5" fill="#ffe3a3"/>
  <circle cx="420" cy="358" r="14" fill="#ffe3a3" fill-opacity="0.25"/>
  <circle cx="560" cy="352" r="5" fill="#ffe3a3"/>
  <circle cx="560" cy="352" r="14" fill="#ffe3a3" fill-opacity="0.25"/>
  <circle cx="700" cy="348" r="5" fill="#ffe3a3"/>
  <circle cx="700" cy="348" r="14" fill="#ffe3a3" fill-opacity="0.25"/>
  <circle cx="840" cy="356" r="5" fill="#ffe3a3"/>
  <circle cx="840" cy="356" r="14" fill="#ffe3a3" fill-opacity="0.25"/>

  <!-- Potted Plants in Patio -->
  <!-- Left planter -->
  <rect x="230" y="580" width="50" height="60" rx="3" fill="#2d221b"/>
  <ellipse cx="255" cy="540" rx="35" ry="50" fill="#203322" opacity="0.9"/>
  <!-- Right planter -->
  <rect x="910" y="580" width="55" height="60" rx="3" fill="#2d221b"/>
  <ellipse cx="937" cy="530" rx="40" ry="60" fill="#223624" opacity="0.9"/>

  <!-- Patio Table Set -->
  <ellipse cx="680" cy="710" rx="40" ry="16" fill="#1b1c20" stroke="#c4a574" stroke-width="1"/>
  <line x1="680" y1="710" x2="680" y2="760" stroke="#c4a574" stroke-width="2"/>
  <ellipse cx="610" cy="720" rx="18" ry="9" fill="#1b1c20"/>
  <ellipse cx="750" cy="720" rx="18" ry="9" fill="#1b1c20"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="220" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">PH · PATIO PRIVADO · RECICLADO</text>
</svg>
