<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="h1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="60%" stop-color="#222026"/>
      <stop offset="100%" stop-color="#322922"/>
    </linearGradient>
    <linearGradient id="h1Glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d4a359" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="h1Wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28282e"/>
      <stop offset="100%" stop-color="#1e1e22"/>
    </linearGradient>
    <linearGradient id="h1Timber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#543d2b"/>
      <stop offset="100%" stop-color="#3d2a1d"/>
    </linearGradient>
    <linearGradient id="h1Lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f281e"/>
      <stop offset="100%" stop-color="#131a12"/>
    </linearGradient>
    <linearGradient id="h1Light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e1b5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5e1b5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#h1Sky)"/>
  <circle cx="950" cy="180" r="1.5" fill="#f3efe6" opacity="0.6"/>
  <circle cx="320" cy="140" r="2" fill="#c4a574" opacity="0.5"/>
  <circle cx="150" cy="220" r="1.5" fill="#f3efe6" opacity="0.4"/>

  <!-- Distant tree line -->
  <path d="M0 550 Q200 520 400 535 T800 525 T1200 540 V650 H0 Z" fill="#141517"/>

  <!-- Ground / Lawn & Driveway -->
  <rect x="0" y="580" width="1200" height="220" fill="url(#h1Lawn)"/>
  <polygon points="120,800 360,580 500,580 420,800" fill="#202024" stroke="#2c2c34" stroke-width="1"/>

  <!-- Two-Storey Contemporary House (Main Mass) -->
  <!-- Ground floor base -->
  <rect x="340" y="420" width="620" height="190" rx="3" fill="url(#h1Wall)" stroke="#383842" stroke-width="1.5"/>
  
  <!-- Second floor cantilever block -->
  <rect x="390" y="270" width="520" height="170" rx="3" fill="#202026" stroke="#383842" stroke-width="1.5"/>
  
  <!-- Warm timber cladding section (upper left) -->
  <rect x="390" y="270" width="160" height="170" fill="url(#h1Timber)"/>
  <line x1="422" y1="270" x2="422" y2="440" stroke="#251a12" stroke-width="2"/>
  <line x1="454" y1="270" x2="454" y2="440" stroke="#251a12" stroke-width="2"/>
  <line x1="486" y1="270" x2="486" y2="440" stroke="#251a12" stroke-width="2"/>
  <line x1="518" y1="270" x2="518" y2="440" stroke="#251a12" stroke-width="2"/>

  <!-- Upper floor master suite window (right) -->
  <rect x="580" y="300" width="300" height="110" rx="2" fill="url(#h1Glow)" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="680" y1="300" x2="680" y2="410" stroke="#24242a" stroke-width="2.5"/>
  <line x1="780" y1="300" x2="780" y2="410" stroke="#24242a" stroke-width="2.5"/>

  <!-- Ground floor large living room glazing -->
  <rect x="520" y="450" width="410" height="150" rx="2" fill="url(#h1Glow)" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="620" y1="450" x2="620" y2="600" stroke="#24242a" stroke-width="3"/>
  <line x1="725" y1="450" x2="725" y2="600" stroke="#24242a" stroke-width="3"/>
  <line x1="830" y1="450" x2="830" y2="600" stroke="#24242a" stroke-width="3"/>

  <!-- Main entrance door (pivot wood door) -->
  <rect x="380" y="460" width="80" height="140" fill="#3a2719" stroke="#c4a574" stroke-width="1"/>
  <line x1="445" y1="520" x2="445" y2="560" stroke="#c4a574" stroke-width="2.5"/>
  <polygon points="420,440 380,510 460,510" fill="url(#h1Light)"/>
  <circle cx="420" cy="445" r="3" fill="#fdf2d8"/>

  <!-- Covered Double Carport / Pergola (left) -->
  <rect x="180" y="470" width="180" height="14" fill="#2c2c34"/>
  <line x1="200" y1="484" x2="200" y2="610" stroke="#383844" stroke-width="6"/>
  <line x1="330" y1="484" x2="330" y2="610" stroke="#383844" stroke-width="6"/>
  <!-- Luxury car silhouette parked inside -->
  <path d="M210 590 Q225 560 260 558 Q295 560 320 590 Z" fill="#141416"/>
  <circle cx="230" cy="595" r="9" fill="#222"/>
  <circle cx="300" cy="595" r="9" fill="#222"/>

  <!-- Architectural downlights -->
  <polygon points="630,270 590,340 670,340" fill="url(#h1Light)"/>
  <polygon points="830,270 790,340 870,340" fill="url(#h1Light)"/>

  <!-- Landscaping: modern garden planters & ornamental grasses -->
  <rect x="490" y="585" width="460" height="20" rx="3" fill="#222226" stroke="#33333d" stroke-width="1"/>
  <path d="M510 585 C515 560 530 550 535 585 M540 585 C550 545 565 545 570 585 M750 585 C760 550 780 540 790 585 M820 585 C830 555 845 550 855 585" stroke="#3a4f38" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Left tree silhouette -->
  <path d="M120 620 Q140 450 150 360 Q160 450 180 620" stroke="#161817" stroke-width="8"/>
  <circle cx="150" cy="360" r="70" fill="#182218" opacity="0.85"/>
  <circle cx="120" cy="390" r="50" fill="#151e15" opacity="0.9"/>
  <circle cx="180" cy="380" r="55" fill="#1b261b" opacity="0.9"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="190" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.8" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">CASA · 210 M²</text>
</svg>
