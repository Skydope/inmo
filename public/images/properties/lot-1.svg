<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="l1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14181a"/>
      <stop offset="40%" stop-color="#242b26"/>
      <stop offset="80%" stop-color="#4a402e"/>
      <stop offset="100%" stop-color="#2a2216"/>
    </linearGradient>
    <radialGradient id="l1Sun" cx="65%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c4a574" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#242b26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l1Field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232e1f"/>
      <stop offset="50%" stop-color="#2b3b25"/>
      <stop offset="100%" stop-color="#182115"/>
    </linearGradient>
    <linearGradient id="l1Road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1d21"/>
      <stop offset="100%" stop-color="#25262c"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#l1Sky)"/>
  <rect width="1200" height="800" fill="url(#l1Sun)"/>

  <!-- Horizon & Distant Tree Silhouettes (Las Acacias neighborhood) -->
  <path d="M0 460 Q300 440 600 450 T1200 445 V550 H0 Z" fill="#151b14"/>
  
  <!-- Acacia Trees Row in Background -->
  <circle cx="160" cy="420" r="50" fill="#1b241a"/>
  <circle cx="280" cy="410" r="65" fill="#202b1f"/>
  <circle cx="420" cy="425" r="55" fill="#1d281c"/>
  <circle cx="750" cy="405" r="70" fill="#263424"/>
  <circle cx="890" cy="415" r="60" fill="#1e291d"/>
  <circle cx="1040" cy="420" r="55" fill="#1b241a"/>

  <!-- Residential Lot Meadow / Ground -->
  <polygon points="0,520 1200,500 1200,800 0,800" fill="url(#l1Field)"/>
  
  <!-- Subtle Mowed Lawn Stripes / Perspective Lines -->
  <line x1="200" y1="520" x2="-100" y2="800" stroke="#1d271a" stroke-width="3"/>
  <line x1="450" y1="515" x2="250" y2="800" stroke="#1d271a" stroke-width="4"/>
  <line x1="700" y1="510" x2="620" y2="800" stroke="#1d271a" stroke-width="4"/>
  <line x1="950" y1="505" x2="990" y2="800" stroke="#1d271a" stroke-width="4"/>

  <!-- Boundary Survey Pegs / Delimitation Lines (Lot 600 m2) -->
  <!-- Surveyor wooden pegs with gold/orange flags -->
  <!-- Front Left Peg -->
  <polygon points="260,650 270,650 268,730 262,730" fill="#d9a25f"/>
  <polygon points="270,650 310,660 270,670" fill="#c4a574"/>
  <!-- Front Right Peg -->
  <polygon points="880,640 890,640 888,720 882,720" fill="#d9a25f"/>
  <polygon points="890,640 930,650 890,660" fill="#c4a574"/>
  <!-- Back Left Peg -->
  <polygon points="380,530 386,530 385,570 381,570" fill="#a47842"/>
  <polygon points="386,530 408,536 386,542" fill="#c4a574"/>
  <!-- Back Right Peg -->
  <polygon points="790,525 796,525 795,565 791,565" fill="#a47842"/>
  <polygon points="796,525 818,531 796,537" fill="#c4a574"/>

  <!-- Lot Perimeter Dotted Line -->
  <polygon points="265,690 383,550 793,545 885,680" stroke="#c4a574" stroke-width="1.8" stroke-dasharray="6 6" fill="#c4a574" fill-opacity="0.06"/>

  <!-- Paved Front Street / Cordón Cuneta -->
  <polygon points="0,730 1200,710 1200,800 0,800" fill="url(#l1Road)"/>
  <line x1="0" y1="730" x2="1200" y2="710" stroke="#3d4047" stroke-width="4"/>
  <line x1="0" y1="734" x2="1200" y2="714" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Architectural Dimension Marker -->
  <rect x="520" y="600" width="130" height="28" rx="14" fill="#141416" stroke="#c4a574" stroke-width="1"/>
  <text x="585" y="618" fill="#dfc298" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle" letter-spacing="1">20m x 30m</text>

  <!-- Specimen Acacia Tree (Foreground Left) -->
  <path d="M120 750 Q130 580 150 480 Q170 580 180 750" stroke="#121612" stroke-width="10"/>
  <ellipse cx="150" cy="460" rx="90" ry="70" fill="#202c1f" opacity="0.9"/>
  <ellipse cx="120" cy="480" rx="70" ry="50" fill="#182317" opacity="0.9"/>
  <ellipse cx="190" cy="470" rx="65" ry="50" fill="#243323" opacity="0.85"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="230" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">LOTE · 600 M² · ESCRITURA</text>
</svg>
