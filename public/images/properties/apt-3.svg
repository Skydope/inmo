<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="a3Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101217"/>
      <stop offset="50%" stop-color="#1c212a"/>
      <stop offset="100%" stop-color="#342b22"/>
    </linearGradient>
    <linearGradient id="a3Glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2d4"/>
      <stop offset="60%" stop-color="#f5d38c"/>
      <stop offset="100%" stop-color="#c99746"/>
    </linearGradient>
    <linearGradient id="a3Bldg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24262d"/>
      <stop offset="50%" stop-color="#2f323c"/>
      <stop offset="100%" stop-color="#202227"/>
    </linearGradient>
    <linearGradient id="a3Street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#a3Sky)"/>
  <circle cx="890" cy="110" r="1.5" fill="#f3efe6" opacity="0.6"/>
  <circle cx="1060" cy="160" r="2" fill="#c4a574" opacity="0.5"/>

  <!-- Distant City Outline -->
  <path d="M0 500 Q400 480 800 495 T1200 490 V620 H0 Z" fill="#13151a"/>

  <!-- Boutique Condominium Building Façade (Center-left) -->
  <rect x="320" y="120" width="560" height="540" fill="url(#a3Bldg)" stroke="#3e424f" stroke-width="2"/>

  <!-- Building Cornice / Parapet with Accent Light Line -->
  <rect x="300" y="110" width="600" height="15" rx="3" fill="#1b1c21"/>
  <line x1="310" y1="125" x2="890" y2="125" stroke="#c4a574" stroke-width="2"/>

  <!-- Floor 3 (Piso 3) -->
  <!-- Balcony Left -->
  <rect x="350" y="160" width="230" height="85" fill="url(#a3Glow)"/>
  <line x1="465" y1="160" x2="465" y2="245" stroke="#1d1e24" stroke-width="2"/>
  <rect x="340" y="210" width="250" height="45" fill="#4d6e80" fill-opacity="0.18" stroke="#c4a574" stroke-width="1.2"/>
  <!-- Balcony Right -->
  <rect x="620" y="160" width="230" height="85" fill="url(#a3Glow)"/>
  <line x1="735" y1="160" x2="735" y2="245" stroke="#1d1e24" stroke-width="2"/>
  <rect x="610" y="210" width="250" height="45" fill="#4d6e80" fill-opacity="0.18" stroke="#c4a574" stroke-width="1.2"/>

  <!-- Floor 2 (Piso 2) -->
  <!-- Balcony Left -->
  <rect x="350" y="280" width="230" height="85" fill="url(#a3Glow)"/>
  <line x1="465" y1="280" x2="465" y2="365" stroke="#1d1e24" stroke-width="2"/>
  <rect x="340" y="330" width="250" height="45" fill="#4d6e80" fill-opacity="0.18" stroke="#c4a574" stroke-width="1.2"/>
  <!-- Balcony Right -->
  <rect x="620" y="280" width="230" height="85" fill="url(#a3Glow)"/>
  <line x1="735" y1="280" x2="735" y2="365" stroke="#1d1e24" stroke-width="2"/>
  <rect x="610" y="330" width="250" height="45" fill="#4d6e80" fill-opacity="0.18" stroke="#c4a574" stroke-width="1.2"/>

  <!-- Floor 1 (Piso 1) -->
  <!-- Balcony Left -->
  <rect x="350" y="400" width="230" height="85" fill="url(#a3Glow)"/>
  <line x1="465" y1="400" x2="465" y2="485" stroke="#1d1e24" stroke-width="2"/>
  <rect x="340" y="450" width="250" height="45" fill="#4d6e80" fill-opacity="0.18" stroke="#c4a574" stroke-width="1.2"/>
  <!-- Balcony Right -->
  <rect x="620" y="400" width="230" height="85" fill="url(#a3Glow)"/>
  <line x1="735" y1="400" x2="735" y2="485" stroke="#1d1e24" stroke-width="2"/>
  <rect x="610" y="450" width="250" height="45" fill="#4d6e80" fill-opacity="0.18" stroke="#c4a574" stroke-width="1.2"/>

  <!-- Planter greenery on balconies -->
  <path d="M540 215 C555 195 575 195 585 215" stroke="#33593b" stroke-width="4" fill="none"/>
  <path d="M625 335 C640 315 660 315 670 335" stroke="#33593b" stroke-width="4" fill="none"/>
  <path d="M805 455 C820 435 840 435 850 455" stroke="#33593b" stroke-width="4" fill="none"/>

  <!-- Ground Floor (Planta Baja): Hall de Entrada + Portón Cocheras -->
  <rect x="320" y="520" width="560" height="140" fill="#18191e" stroke="#2d3039" stroke-width="2"/>

  <!-- Pedestrian Entrance Hall (Left) with tempered glass & backlight -->
  <rect x="360" y="540" width="160" height="120" fill="url(#a3Glow)" stroke="#c4a574" stroke-width="2"/>
  <rect x="380" y="550" width="120" height="110" fill="#141518" fill-opacity="0.4"/>
  <line x1="440" y1="550" x2="440" y2="660" stroke="#c4a574" stroke-width="2"/>
  <text x="440" y="533" fill="#dfc298" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="2">ALSINA 780</text>

  <!-- Automated Garage Gate (Portón levadizo cocheras - Right) -->
  <rect x="560" y="540" width="280" height="120" rx="3" fill="#131417" stroke="#383944" stroke-width="2"/>
  <!-- Modern horizontal metal slats on gate -->
  <line x1="565" y1="560" x2="835" y2="560" stroke="#c4a574" stroke-width="1.8" stroke-opacity="0.7"/>
  <line x1="565" y1="580" x2="835" y2="580" stroke="#c4a574" stroke-width="1.8" stroke-opacity="0.7"/>
  <line x1="565" y1="600" x2="835" y2="600" stroke="#c4a574" stroke-width="1.8" stroke-opacity="0.7"/>
  <line x1="565" y1="620" x2="835" y2="620" stroke="#c4a574" stroke-width="1.8" stroke-opacity="0.7"/>
  <line x1="565" y1="640" x2="835" y2="640" stroke="#c4a574" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Garage sign -->
  <rect x="670" y="525" width="60" height="12" rx="2" fill="#20222a"/>
  <text x="700" y="534" fill="#c4a574" font-family="system-ui, sans-serif" font-weight="700" font-size="7" text-anchor="middle">COCHERA</text>

  <!-- Street, Sidewalk & Trees (Alsina street) -->
  <polygon points="0,660 1200,660 1200,800 0,800" fill="url(#a3Street)"/>
  <line x1="0" y1="660" x2="1200" y2="660" stroke="#383b44" stroke-width="3"/>
  <line x1="0" y1="710" x2="1200" y2="710" stroke="#25262c" stroke-width="2"/>

  <!-- Street tree on right -->
  <path d="M1020 720 Q1010 540 1025 450 Q1040 540 1045 720" stroke="#171816" stroke-width="8"/>
  <circle cx="1025" cy="430" r="75" fill="#1b281c" opacity="0.9"/>
  <circle cx="985" cy="460" r="55" fill="#162217" opacity="0.9"/>
  <circle cx="1065" cy="450" r="60" fill="#203021" opacity="0.85"/>

  <!-- Streetlamp with warm cone -->
  <line x1="200" y1="460" x2="200" y2="700" stroke="#262830" stroke-width="4"/>
  <path d="M200 460 Q200 430 230 430 H240" stroke="#262830" stroke-width="3" fill="none"/>
  <circle cx="240" cy="435" r="4" fill="#ffecb8"/>
  <polygon points="240,435 170,590 310,590" fill="#ffecb8" fill-opacity="0.12"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="240" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">3 AMBIENTES · CON COCHERA</text>
</svg>
