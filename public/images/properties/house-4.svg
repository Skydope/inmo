<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1118"/>
      <stop offset="55%" stop-color="#1a1e28"/>
      <stop offset="100%" stop-color="#362920"/>
    </linearGradient>
    <linearGradient id="cGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="50%" stop-color="#fce2aa"/>
      <stop offset="100%" stop-color="#cca05d"/>
    </linearGradient>
    <linearGradient id="cWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a292e"/>
      <stop offset="50%" stop-color="#35343c"/>
      <stop offset="100%" stop-color="#252429"/>
    </linearGradient>
    <linearGradient id="cStreet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16171b"/>
      <stop offset="100%" stop-color="#0e0f12"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#cSky)"/>
  <circle cx="850" cy="110" r="1.5" fill="#f3efe6" opacity="0.6"/>
  <circle cx="1020" cy="140" r="2" fill="#c4a574" opacity="0.7"/>

  <!-- Distant street perspective -->
  <path d="M0 520 Q300 500 600 515 T1200 510 V640 H0 Z" fill="#13141a"/>

  <!-- Corner Commercial Building (Ochava clásica de 2 plantas) -->
  <!-- Upper Floor (Vivienda familiar / oficinas) -->
  <polygon points="260,200 600,160 880,180 940,240 940,430 260,430" fill="url(#cWall)" stroke="#3e3d47" stroke-width="2"/>

  <!-- Decorative Cornice & Moldings -->
  <rect x="250" y="190" width="700" height="16" rx="2" fill="#202026"/>
  <line x1="250" y1="206" x2="950" y2="206" stroke="#c4a574" stroke-width="2"/>

  <!-- Upper Floor French Windows & Balconies (Residencia) -->
  <!-- Window 1 (Left) -->
  <rect x="330" y="240" width="90" height="130" rx="3" fill="url(#cGlow)"/>
  <line x1="375" y1="240" x2="375" y2="370" stroke="#1d1d22" stroke-width="2"/>
  <rect x="320" y="330" width="110" height="50" fill="#18181d" stroke="#c4a574" stroke-width="1.2"/>
  <!-- Iron balustrade pattern -->
  <line x1="340" y1="330" x2="340" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="360" y1="330" x2="360" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="380" y1="330" x2="380" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="400" y1="330" x2="400" y2="380" stroke="#c4a574" stroke-width="1.5"/>

  <!-- Window 2 (Center) -->
  <rect x="520" y="240" width="90" height="130" rx="3" fill="url(#cGlow)"/>
  <line x1="565" y1="240" x2="565" y2="370" stroke="#1d1d22" stroke-width="2"/>
  <rect x="510" y="330" width="110" height="50" fill="#18181d" stroke="#c4a574" stroke-width="1.2"/>
  <line x1="530" y1="330" x2="530" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="550" y1="330" x2="550" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="570" y1="330" x2="570" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="590" y1="330" x2="590" y2="380" stroke="#c4a574" stroke-width="1.5"/>

  <!-- Window 3 (Corner Ochava angle) -->
  <rect x="710" y="240" width="90" height="130" rx="3" fill="url(#cGlow)"/>
  <line x1="755" y1="240" x2="755" y2="370" stroke="#1d1d22" stroke-width="2"/>
  <rect x="700" y="330" width="110" height="50" fill="#18181d" stroke="#c4a574" stroke-width="1.2"/>
  <line x1="720" y1="330" x2="720" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="740" y1="330" x2="740" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="760" y1="330" x2="760" y2="380" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="780" y1="330" x2="780" y2="380" stroke="#c4a574" stroke-width="1.5"/>

  <!-- Ground Floor (Local Comercial - Vidrieras Panorámicas) -->
  <rect x="240" y="420" width="710" height="210" fill="#18181d" stroke="#2d2d35" stroke-width="2"/>
  <!-- Commercial Fascia Sign Board -->
  <rect x="250" y="430" width="690" height="35" rx="3" fill="#141417" stroke="#c4a574" stroke-width="1"/>
  <text x="595" y="452" fill="#dfc298" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="3">ESQUINA COMERCIAL · LOCAL VIDRIADO</text>

  <!-- Large Showroom Glass Windows (Vidrieras con luz brillante) -->
  <!-- Left Window -->
  <rect x="270" y="480" width="180" height="140" rx="3" fill="url(#cGlow)" stroke="#c4a574" stroke-width="1.8"/>
  <line x1="360" y1="480" x2="360" y2="620" stroke="#1c1c20" stroke-width="3"/>
  <!-- Interior showroom displays -->
  <circle cx="360" cy="530" r="16" fill="#cca05d" opacity="0.4"/>

  <!-- Center Double Entrance Doors (Blindex) -->
  <rect x="490" y="480" width="150" height="140" rx="2" fill="url(#cGlow)" stroke="#c4a574" stroke-width="2"/>
  <line x1="565" y1="480" x2="565" y2="620" stroke="#1c1c20" stroke-width="3"/>
  <!-- Long stainless/gold door pull handles -->
  <line x1="555" y1="520" x2="555" y2="580" stroke="#c4a574" stroke-width="3"/>
  <line x1="575" y1="520" x2="575" y2="580" stroke="#c4a574" stroke-width="3"/>

  <!-- Right Corner Window (Ochava) -->
  <rect x="680" y="480" width="240" height="140" rx="3" fill="url(#cGlow)" stroke="#c4a574" stroke-width="1.8"/>
  <line x1="760" y1="480" x2="760" y2="620" stroke="#1c1c20" stroke-width="3"/>
  <line x1="840" y1="480" x2="840" y2="620" stroke="#1c1c20" stroke-width="3"/>

  <!-- Avenue Intersection / Corner Sidewalk & Street -->
  <polygon points="0,630 1200,630 1200,800 0,800" fill="url(#cStreet)"/>
  <!-- Sidewalk curb (Cordón de esquina) -->
  <path d="M120 660 L850 660 Q950 660 980 720 L1020 800" stroke="#363944" stroke-width="4" fill="none"/>
  <line x1="0" y1="670" x2="1200" y2="670" stroke="#c4a574" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Street signs: Av. Bolívar / Sarmiento -->
  <g>
    <line x1="990" y1="520" x2="990" y2="700" stroke="#25262c" stroke-width="4"/>
    <rect x="940" y="520" width="100" height="22" rx="3" fill="#18181d" stroke="#c4a574" stroke-width="1"/>
    <text x="990" y="535" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="8" text-anchor="middle">AV. BOLÍVAR</text>
    <rect x="940" y="546" width="100" height="22" rx="3" fill="#18181d" stroke="#c4a574" stroke-width="1"/>
    <text x="990" y="561" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="8" text-anchor="middle">SARMIENTO</text>
  </g>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="250" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">LOCAL + VIVIENDA · 140 M²</text>
</svg>
