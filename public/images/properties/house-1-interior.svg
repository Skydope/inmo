<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="intGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="60%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#2a251e"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b39"/>
      <stop offset="50%" stop-color="#ffa834"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
    <linearGradient id="glassNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#intGrad)"/>

  <!-- Double-height glass curtain wall to garden (Left & Center) -->
  <rect x="80" y="60" width="680" height="600" fill="url(#glassNight)" stroke="#2b2d38" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="660" stroke="#16171d" stroke-width="4"/>
  <line x1="520" y1="60" x2="520" y2="660" stroke="#16171d" stroke-width="4"/>
  <line x1="80" y1="360" x2="760" y2="360" stroke="#16171d" stroke-width="4"/>
  <!-- Garden lighting outside glass -->
  <circle cx="200" cy="500" r="40" fill="#203623" opacity="0.6"/>
  <circle cx="420" cy="480" r="50" fill="#1b301f" opacity="0.6"/>
  <circle cx="620" cy="510" r="35" fill="#233d27" opacity="0.6"/>

  <!-- Minimalist Modern Linear Fireplace (Bioetanol / Gas Hogar) -->
  <rect x="820" y="240" width="320" height="420" rx="4" fill="#1a1a20" stroke="#363844" stroke-width="2"/>
  <rect x="860" y="440" width="240" height="80" rx="3" fill="#0d0d10"/>
  <!-- Linear flame glow -->
  <ellipse cx="980" cy="480" rx="100" ry="20" fill="url(#fireGrad)" opacity="0.9"/>
  <ellipse cx="980" cy="475" rx="60" ry="12" fill="#fff5d6"/>

  <!-- TV / Architectural Art niche above fireplace -->
  <rect x="860" y="270" width="240" height="130" rx="3" fill="#121215" stroke="#c4a574" stroke-width="1"/>
  <circle cx="980" cy="335" r="28" fill="#c4a574" fill-opacity="0.15" stroke="#c4a574" stroke-width="1.2"/>

  <!-- Polished Microcement Floor with reflection -->
  <polygon points="0,640 1200,640 1200,800 0,800" fill="#17181c"/>
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#2c2d36" stroke-width="2"/>
  <ellipse cx="980" cy="650" rx="120" ry="10" fill="#ffa834" fill-opacity="0.2"/>

  <!-- Designer Lounge Sectional Sofa -->
  <rect x="240" y="540" width="460" height="150" rx="18" fill="#24262d" stroke="#3a3c48" stroke-width="1.5"/>
  <rect x="260" y="510" width="400" height="60" rx="12" fill="#2d303a"/>
  <!-- Throw cushions in gold & ivory -->
  <rect x="280" y="520" width="60" height="45" rx="6" fill="#c4a574"/>
  <rect x="580" y="520" width="60" height="45" rx="6" fill="#f3efe6"/>

  <!-- Low marble coffee table -->
  <ellipse cx="480" cy="720" rx="120" ry="35" fill="#131417" stroke="#c4a574" stroke-width="1.5"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="240" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">LIVING · DOBLE ALTURA</text>
</svg>
