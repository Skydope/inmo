<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="60%" stop-color="#212632"/>
      <stop offset="100%" stop-color="#3c3127"/>
    </linearGradient>
    <linearGradient id="mGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="50%" stop-color="#f5d697"/>
      <stop offset="100%" stop-color="#c99748"/>
    </linearGradient>
    <linearGradient id="mKitchen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24262d"/>
      <stop offset="100%" stop-color="#191a1e"/>
    </linearGradient>
    <linearGradient id="mWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4332"/>
      <stop offset="100%" stop-color="#2c1f17"/>
    </linearGradient>
  </defs>

  <!-- Studio Room Base Wall -->
  <rect width="1200" height="800" fill="#18181c"/>
  
  <!-- Large City Window (Right side) -->
  <rect x="740" y="80" width="420" height="520" fill="url(#mSky)" stroke="#32333d" stroke-width="2"/>
  <!-- Distant Bolívar city night silhouettes outside window -->
  <path d="M740 480 Q840 460 920 470 T1160 460 V600 H740 Z" fill="#0d1017"/>
  <rect x="800" y="440" width="40" height="50" fill="#131720"/>
  <rect x="880" y="420" width="50" height="70" fill="#131720"/>
  <rect x="1000" y="430" width="60" height="60" fill="#131720"/>
  <!-- Window mullions -->
  <line x1="950" y1="80" x2="950" y2="600" stroke="#16171c" stroke-width="4"/>
  <line x1="740" y1="360" x2="1160" y2="360" stroke="#16171c" stroke-width="3"/>
  <!-- Window drape / sheer curtain (Right) -->
  <path d="M1100 80 Q1080 340 1140 600 H1160 V80 Z" fill="#f3efe6" fill-opacity="0.12"/>

  <!-- Timber Flooring with warm reflections -->
  <polygon points="0,560 1200,560 1200,800 0,800" fill="url(#mWood)"/>
  <line x1="160" y1="560" x2="40" y2="800" stroke="#1f150e" stroke-width="1.5"/>
  <line x1="380" y1="560" x2="280" y2="800" stroke="#1f150e" stroke-width="1.5"/>
  <line x1="600" y1="560" x2="560" y2="800" stroke="#1f150e" stroke-width="1.5"/>
  <line x1="820" y1="560" x2="840" y2="800" stroke="#1f150e" stroke-width="1.5"/>
  <line x1="1040" y1="560" x2="1100" y2="800" stroke="#1f150e" stroke-width="1.5"/>

  <!-- Kitchenette / Breakfast Bar (Left side) -->
  <!-- Upper cabinets with warm LED under-cabinet strip -->
  <rect x="80" y="140" width="420" height="120" rx="2" fill="url(#mKitchen)" stroke="#33353e" stroke-width="1"/>
  <line x1="80" y1="260" x2="500" y2="260" stroke="#f5d697" stroke-width="3" stroke-linecap="round"/>
  <!-- LED warm glow -->
  <rect x="80" y="262" width="420" height="50" fill="url(#mGlow)" fill-opacity="0.15"/>

  <!-- Kitchen Splashback / Tile detail -->
  <rect x="80" y="260" width="420" height="110" fill="#1b1c20"/>
  <!-- Subtle subway tile pattern -->
  <g stroke="#26272e" stroke-width="1" opacity="0.6">
    <line x1="80" y1="285" x2="500" y2="285"/>
    <line x1="80" y1="310" x2="500" y2="310"/>
    <line x1="80" y1="335" x2="500" y2="335"/>
  </g>

  <!-- Kitchen Counter & Island Bar -->
  <rect x="60" y="370" width="460" height="230" rx="3" fill="url(#mKitchen)" stroke="#383a45" stroke-width="1.5"/>
  <!-- Marble Countertop in champagne tone -->
  <rect x="50" y="360" width="480" height="18" rx="2" fill="#d9cbb4" stroke="#c4a574" stroke-width="1"/>
  <!-- Modern induction cooktop -->
  <rect x="120" y="362" width="90" height="8" rx="2" fill="#111"/>
  <circle cx="150" cy="366" r="3" fill="#ff4d4d" opacity="0.8"/>
  <!-- Modern mixer tap / grifería monocomando dorada -->
  <path d="M380 360 V320 C380 305 410 305 410 325" stroke="#c4a574" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Bar Stools (2 Designer Stools) -->
  <!-- Stool 1 -->
  <ellipse cx="280" cy="500" rx="24" ry="10" fill="#18181a" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="270" y1="505" x2="260" y2="650" stroke="#c4a574" stroke-width="2"/>
  <line x1="290" y1="505" x2="300" y2="650" stroke="#c4a574" stroke-width="2"/>
  <line x1="265" y1="570" x2="295" y2="570" stroke="#c4a574" stroke-width="1.5"/>

  <!-- Stool 2 -->
  <ellipse cx="420" cy="500" rx="24" ry="10" fill="#18181a" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="410" y1="505" x2="400" y2="650" stroke="#c4a574" stroke-width="2"/>
  <line x1="430" y1="505" x2="440" y2="650" stroke="#c4a574" stroke-width="2"/>
  <line x1="405" y1="570" x2="435" y2="570" stroke="#c4a574" stroke-width="1.5"/>

  <!-- 3 Champagne Pendant Lights above Island -->
  <g>
    <line x1="220" y1="80" x2="220" y2="210" stroke="#c4a574" stroke-width="1.5"/>
    <path d="M205 210 L235 210 L225 240 L215 240 Z" fill="#c4a574"/>
    <circle cx="220" cy="245" r="5" fill="#fff5d6"/>
    <circle cx="220" cy="245" r="18" fill="#fff5d6" fill-opacity="0.25"/>

    <line x1="320" y1="80" x2="320" y2="190" stroke="#c4a574" stroke-width="1.5"/>
    <path d="M305 190 L335 190 L325 220 L315 220 Z" fill="#c4a574"/>
    <circle cx="320" cy="225" r="5" fill="#fff5d6"/>
    <circle cx="320" cy="225" r="18" fill="#fff5d6" fill-opacity="0.25"/>

    <line x1="420" y1="80" x2="420" y2="210" stroke="#c4a574" stroke-width="1.5"/>
    <path d="M405 210 L435 210 L425 240 L415 240 Z" fill="#c4a574"/>
    <circle cx="420" cy="245" r="5" fill="#fff5d6"/>
    <circle cx="420" cy="245" r="18" fill="#fff5d6" fill-opacity="0.25"/>
  </g>

  <!-- Living / Bed Nook area (Right) -->
  <!-- Modern low profile bed / lounge sofa -->
  <rect x="620" y="520" width="380" height="90" rx="8" fill="#2d3038" stroke="#3d404a" stroke-width="1"/>
  <!-- Pillows in linen off-white & gold -->
  <rect x="650" y="490" width="60" height="40" rx="5" fill="#ede8de"/>
  <rect x="730" y="490" width="60" height="40" rx="5" fill="#c4a574"/>
  <!-- Throw blanket -->
  <rect x="850" y="520" width="140" height="90" rx="4" fill="#a48a60" fill-opacity="0.6"/>

  <!-- Wool Textured Rug under living -->
  <ellipse cx="780" cy="670" rx="200" ry="50" fill="#282622" stroke="#c4a574" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="230" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">MONOAMBIENTE · AMOBLADO</text>
</svg>
