<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="l2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12151e"/>
      <stop offset="50%" stop-color="#1f242e"/>
      <stop offset="85%" stop-color="#403222"/>
      <stop offset="100%" stop-color="#231b12"/>
    </linearGradient>
    <radialGradient id="l2Glow" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c4a574" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12151e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l2Ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252422"/>
      <stop offset="50%" stop-color="#2d2a25"/>
      <stop offset="100%" stop-color="#1a1815"/>
    </linearGradient>
    <linearGradient id="l2Ave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2025"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#l2Sky)"/>
  <rect width="1200" height="800" fill="url(#l2Glow)"/>

  <!-- Distant commercial buildings & warehouses in Bolívar Avenue -->
  <path d="M0 460 Q300 440 600 450 T1200 440 V560 H0 Z" fill="#13151a"/>
  <!-- Commercial building silhouettes next door -->
  <rect x="60" y="380" width="180" height="180" fill="#181a20" stroke="#252830" stroke-width="1"/>
  <rect x="960" y="360" width="200" height="200" fill="#181a20" stroke="#252830" stroke-width="1"/>

  <!-- Commercial Plot Surface (Compacted / Level Ground) -->
  <polygon points="200,520 1000,520 1140,730 60,730" fill="url(#l2Ground)"/>

  <!-- Lot Delimitation Wire / Posts (Frontage 15m x 30m) -->
  <line x1="200" y1="520" x2="1000" y2="520" stroke="#c4a574" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="200" y1="520" x2="60" y2="730" stroke="#c4a574" stroke-width="1.8" stroke-dasharray="6 6"/>
  <line x1="1000" y1="520" x2="1140" y2="730" stroke="#c4a574" stroke-width="1.8" stroke-dasharray="6 6"/>

  <!-- Perimeter boundary posts in steel & gold paint -->
  <line x1="240" y1="500" x2="240" y2="550" stroke="#c4a574" stroke-width="4"/>
  <line x1="500" y1="495" x2="500" y2="540" stroke="#c4a574" stroke-width="4"/>
  <line x1="760" y1="495" x2="760" y2="540" stroke="#c4a574" stroke-width="4"/>
  <line x1="980" y1="500" x2="980" y2="550" stroke="#c4a574" stroke-width="4"/>

  <!-- Dimension Indicator Banner / Sign on Lot -->
  <rect x="470" y="580" width="260" height="42" rx="6" fill="#16171a" stroke="#c4a574" stroke-width="1.5"/>
  <text x="600" y="606" fill="#dfc298" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">15m FRENTE x 30m FONDO</text>

  <!-- Commercial Zone Badge -->
  <rect x="520" y="530" width="160" height="24" rx="12" fill="#2a2318" stroke="#c4a574" stroke-width="1"/>
  <text x="600" y="546" fill="#f5d697" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1.5">ZONIFICACIÓN C1</text>

  <!-- Av. San Martín Frontage (Wide asphalt avenue + central boulevard curb) -->
  <polygon points="0,710 1200,710 1200,800 0,800" fill="url(#l2Ave)"/>
  <line x1="0" y1="710" x2="1200" y2="710" stroke="#383a42" stroke-width="4"/>
  <!-- Sidewalk curb in concrete -->
  <rect x="0" y="706" width="1200" height="6" fill="#2d2f36"/>

  <!-- Modern Avenue Streetlamps (Double Head LED) -->
  <line x1="880" y1="360" x2="880" y2="710" stroke="#252730" stroke-width="5"/>
  <path d="M850 360 H910" stroke="#252730" stroke-width="4"/>
  <circle cx="850" cy="365" r="4" fill="#fff4d4"/>
  <circle cx="910" cy="365" r="4" fill="#fff4d4"/>
  <polygon points="850,365 770,550 930,550" fill="#fff4d4" fill-opacity="0.12"/>
  <polygon points="910,365 830,550 990,550" fill="#fff4d4" fill-opacity="0.12"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="250" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">LOTE COMERCIAL · 450 M²</text>
</svg>
