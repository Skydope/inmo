<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="a1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="50%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#382e26"/>
    </linearGradient>
    <linearGradient id="a1Glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4db"/>
      <stop offset="60%" stop-color="#f5d697"/>
      <stop offset="100%" stop-color="#ca9a4b"/>
    </linearGradient>
    <linearGradient id="a1Floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d3b2b"/>
      <stop offset="100%" stop-color="#241a12"/>
    </linearGradient>
    <linearGradient id="a1Balcony" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#222329"/>
      <stop offset="100%" stop-color="#2a2c35"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#a1Sky)"/>
  <circle cx="880" cy="140" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="1020" cy="180" r="2" fill="#c4a574" opacity="0.7"/>

  <!-- Distant City Lights / Bolívar Plaza tree canopy -->
  <path d="M0 480 Q300 450 600 460 T1200 470 V620 H0 Z" fill="#11161d"/>
  <circle cx="200" cy="460" r="80" fill="#13241b" opacity="0.8"/>
  <circle cx="320" cy="450" r="60" fill="#182d22" opacity="0.8"/>
  <circle cx="440" cy="470" r="70" fill="#14261d" opacity="0.8"/>
  <!-- Streetlamp glow in park -->
  <circle cx="310" cy="430" r="4" fill="#ffd782"/>
  <circle cx="310" cy="430" r="24" fill="#ffd782" fill-opacity="0.15"/>

  <!-- Apartment Building Structure: Interior + Balcony Terrace -->
  <!-- Interior Room View (Left & Center) -->
  <rect x="0" y="80" width="760" height="720" fill="#1e1e24"/>
  <!-- Warm glowing living room wall & floor -->
  <rect x="20" y="100" width="700" height="660" fill="url(#a1Glow)" fill-opacity="0.9"/>
  <!-- Timber flooring inside -->
  <polygon points="20,520 720,520 720,760 20,760" fill="url(#a1Floor)"/>
  <line x1="120" y1="520" x2="60" y2="760" stroke="#1f160e" stroke-width="1.5"/>
  <line x1="240" y1="520" x2="200" y2="760" stroke="#1f160e" stroke-width="1.5"/>
  <line x1="360" y1="520" x2="340" y2="760" stroke="#1f160e" stroke-width="1.5"/>
  <line x1="480" y1="520" x2="480" y2="760" stroke="#1f160e" stroke-width="1.5"/>
  <line x1="600" y1="520" x2="620" y2="760" stroke="#1f160e" stroke-width="1.5"/>

  <!-- Modern Lounge Furniture -->
  <!-- Minimalist Sofa -->
  <rect x="140" y="440" width="320" height="110" rx="16" fill="#30323a"/>
  <rect x="170" y="410" width="260" height="60" rx="10" fill="#3a3d47"/>
  <!-- Cushions in champagne tones -->
  <rect x="190" y="420" width="50" height="40" rx="6" fill="#c4a574"/>
  <rect x="360" y="420" width="50" height="40" rx="6" fill="#e8dac1"/>
  <!-- Designer Floor Lamp -->
  <line x1="100" y1="300" x2="100" y2="550" stroke="#111" stroke-width="3"/>
  <path d="M80 300 H120 L130 340 H70 Z" fill="#c4a574"/>
  <circle cx="100" cy="350" r="15" fill="#fff" opacity="0.3"/>

  <!-- Minimalist Coffee Table -->
  <ellipse cx="300" cy="580" rx="70" ry="25" fill="#1b1c20" stroke="#c4a574" stroke-width="1"/>

  <!-- Floor-to-Ceiling Glass Sliding Doors (Framing) -->
  <rect x="720" y="60" width="30" height="740" fill="#16161a"/>
  <line x1="735" y1="60" x2="735" y2="800" stroke="#33333d" stroke-width="3"/>
  
  <!-- Balcony Deck (Right Side) -->
  <polygon points="750,420 1200,420 1200,800 750,800" fill="url(#a1Balcony)"/>
  
  <!-- Balcony Glass Railing -->
  <rect x="780" y="370" width="420" height="240" fill="#88b0c4" fill-opacity="0.12" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="880" y1="370" x2="880" y2="610" stroke="#555866" stroke-width="2"/>
  <line x1="990" y1="370" x2="990" y2="610" stroke="#555866" stroke-width="2"/>
  <line x1="1100" y1="370" x2="1100" y2="610" stroke="#555866" stroke-width="2"/>
  <!-- Handrail in dark metal -->
  <rect x="770" y="365" width="430" height="10" rx="3" fill="#18181c" stroke="#c4a574" stroke-width="0.8"/>

  <!-- Balcony Bistro Set (table & 2 chairs) -->
  <ellipse cx="940" cy="540" rx="35" ry="14" fill="#202226" stroke="#c4a574" stroke-width="1"/>
  <line x1="940" y1="540" x2="940" y2="610" stroke="#c4a574" stroke-width="2"/>
  <ellipse cx="860" cy="550" rx="20" ry="10" fill="#202226"/>
  <ellipse cx="1020" cy="550" rx="20" ry="10" fill="#202226"/>

  <!-- Potted Olive Tree / Terrace Plants -->
  <rect x="1100" y="520" width="45" height="70" rx="4" fill="#3d372e"/>
  <circle cx="1122" cy="460" r="45" fill="#2a3f2e" opacity="0.85"/>
  <circle cx="1122" cy="430" r="30" fill="#344f3a" opacity="0.85"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="220" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">DEPTO · 68 M² · VISTA</text>
</svg>
