<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="qSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151720"/>
      <stop offset="45%" stop-color="#24212a"/>
      <stop offset="80%" stop-color="#3d2f23"/>
      <stop offset="100%" stop-color="#2a2016"/>
    </linearGradient>
    <radialGradient id="qGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce4b3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c99745" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="qPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3e42"/>
      <stop offset="60%" stop-color="#132729"/>
      <stop offset="100%" stop-color="#0e1b1d"/>
    </linearGradient>
    <linearGradient id="qLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2c1d"/>
      <stop offset="100%" stop-color="#141c12"/>
    </linearGradient>
    <linearGradient id="qWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2a26"/>
      <stop offset="100%" stop-color="#201f1c"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#qSky)"/>
  <circle cx="240" cy="140" r="1.5" fill="#f3efe6" opacity="0.6"/>
  <circle cx="820" cy="110" r="2" fill="#c4a574" opacity="0.7"/>

  <!-- Distant Eucalyptus & Pine tree rows (Country Quinta setting) -->
  <path d="M0 480 Q300 450 600 460 T1200 455 V600 H0 Z" fill="#131913"/>
  <path d="M60 480 C80 340 120 320 140 480 M150 480 C170 320 210 300 240 480 M980 480 C1000 330 1040 310 1070 480 M1090 480 C1110 350 1140 340 1170 480" stroke="#172216" stroke-width="12" stroke-linecap="round" fill="#172216"/>

  <!-- Sprawling Lawn -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#qLawn)"/>

  <!-- Casa Quinta Main Residence (Single-storey sprawling country house) -->
  <!-- Pitched Roof with overhang -->
  <polygon points="260,340 680,240 1040,340 1010,360 680,265 290,360" fill="#1b1c20" stroke="#2c2d33" stroke-width="2"/>
  <!-- Gable wall -->
  <polygon points="300,360 680,270 980,360 980,480 300,480" fill="url(#qWall)" stroke="#383632" stroke-width="1.5"/>

  <!-- Warm Windows under Roof Gable -->
  <circle cx="680" cy="330" r="22" fill="url(#qGlow)" stroke="#c4a574" stroke-width="2"/>
  <line x1="680" y1="308" x2="680" y2="352" stroke="#201f1c" stroke-width="2"/>
  <line x1="658" y1="330" x2="702" y2="330" stroke="#201f1c" stroke-width="2"/>

  <!-- Traditional Covered Galería / Veranda with wooden columns -->
  <rect x="220" y="380" width="800" height="110" fill="#1a1816" stroke="#2d2822" stroke-width="1.5"/>
  <!-- Galería Roof -->
  <polygon points="180,400 1060,400 1040,380 200,380" fill="#24211d"/>
  <!-- Warm glow spilling through galería French windows -->
  <rect x="340" y="405" width="140" height="80" rx="2" fill="url(#qGlow)"/>
  <rect x="520" y="405" width="140" height="80" rx="2" fill="url(#qGlow)"/>
  <rect x="700" y="405" width="140" height="80" rx="2" fill="url(#qGlow)"/>
  <rect x="880" y="405" width="100" height="80" rx="2" fill="url(#qGlow)"/>

  <!-- Timber Galería Posts / Columns -->
  <line x1="240" y1="390" x2="240" y2="520" stroke="#503e2c" stroke-width="8"/>
  <line x1="380" y1="390" x2="380" y2="520" stroke="#503e2c" stroke-width="8"/>
  <line x1="520" y1="390" x2="520" y2="520" stroke="#503e2c" stroke-width="8"/>
  <line x1="660" y1="390" x2="660" y2="520" stroke="#503e2c" stroke-width="8"/>
  <line x1="800" y1="390" x2="800" y2="520" stroke="#503e2c" stroke-width="8"/>
  <line x1="940" y1="390" x2="940" y2="520" stroke="#503e2c" stroke-width="8"/>
  <line x1="1020" y1="390" x2="1020" y2="520" stroke="#503e2c" stroke-width="8"/>

  <!-- Chimney (Hogar a leña / Parrilla) -->
  <rect x="920" y="240" width="50" height="110" fill="#32221b" stroke="#442e24" stroke-width="1.5"/>
  <rect x="910" y="230" width="70" height="12" rx="2" fill="#201510"/>

  <!-- Solarium Terrace & Swimming Pool (Foreground) -->
  <!-- Stone Pool Deck -->
  <polygon points="280,560 960,560 1080,750 160,750" fill="#222326" stroke="#33353d" stroke-width="1"/>
  <!-- Pool Body -->
  <polygon points="360,580 880,580 970,720 270,720" fill="url(#qPool)" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Underwater Pool Light Glow -->
  <ellipse cx="620" cy="650" rx="160" ry="25" fill="#388085" fill-opacity="0.35"/>
  <ellipse cx="620" cy="650" rx="60" ry="10" fill="#64c5cc" fill-opacity="0.45"/>
  <!-- Stainless steel pool ladder -->
  <path d="M330 600 V640 M345 600 V640 M330 615 H345 M330 630 H345" stroke="#f3efe6" stroke-width="2"/>

  <!-- Sun Loungers / Reposeras alongside pool -->
  <polygon points="760,630 840,610 855,625 775,645" fill="#c4a574"/>
  <polygon points="790,660 870,640 885,655 805,675" fill="#c4a574"/>

  <!-- Landscape: Specimen Willow / Shade Tree on Left -->
  <path d="M120 680 Q100 450 110 380 Q140 450 160 680" stroke="#1a1c18" stroke-width="10"/>
  <ellipse cx="120" cy="380" rx="90" ry="80" fill="#1e2c1e" opacity="0.9"/>
  <ellipse cx="90" cy="420" rx="70" ry="60" fill="#192419" opacity="0.95"/>
  <ellipse cx="160" cy="400" rx="65" ry="65" fill="#243423" opacity="0.9"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="240" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">CASA QUINTA · PARQUE · PILETA</text>
</svg>
