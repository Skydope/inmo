<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="h5Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101217"/>
      <stop offset="50%" stop-color="#1d1e26"/>
      <stop offset="85%" stop-color="#3b2d22"/>
      <stop offset="100%" stop-color="#241b14"/>
    </linearGradient>
    <linearGradient id="h5Glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="60%" stop-color="#f8d898"/>
      <stop offset="100%" stop-color="#cc9a4b"/>
    </linearGradient>
    <linearGradient id="h5Wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2a30"/>
      <stop offset="60%" stop-color="#36343c"/>
      <stop offset="100%" stop-color="#26242a"/>
    </linearGradient>
    <linearGradient id="h5Stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46382a"/>
      <stop offset="100%" stop-color="#2a2016"/>
    </linearGradient>
    <linearGradient id="h5Lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202c1e"/>
      <stop offset="100%" stop-color="#131c12"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#h5Sky)"/>
  <circle cx="880" cy="140" r="1.5" fill="#f3efe6" opacity="0.6"/>
  <circle cx="1020" cy="100" r="2" fill="#c4a574" opacity="0.5"/>
  <circle cx="210" cy="160" r="1.5" fill="#f3efe6" opacity="0.4"/>

  <!-- Distant poplar trees (Álamos) silhouettes of El Mirador -->
  <path d="M0 500 Q300 480 600 490 T1200 480 V600 H0 Z" fill="#131518"/>
  <path d="M80 500 C95 340 105 320 120 500 M140 500 C155 350 165 330 180 500 M200 500 C215 370 225 350 240 500 M1020 500 C1035 340 1045 320 1060 500 M1080 500 C1095 360 1105 340 1120 500" stroke="#161f15" stroke-width="10" stroke-linecap="round" fill="#161f15"/>

  <!-- Front Lawn & Flagstone Pathway -->
  <rect x="0" y="540" width="1200" height="260" fill="url(#h5Lawn)"/>
  
  <!-- Flagstone garden path leading to entrance -->
  <ellipse cx="640" cy="740" rx="60" ry="18" fill="#292930" stroke="#3d3e47" stroke-width="1"/>
  <ellipse cx="620" cy="690" rx="50" ry="15" fill="#292930" stroke="#3d3e47" stroke-width="1"/>
  <ellipse cx="600" cy="640" rx="45" ry="14" fill="#292930" stroke="#3d3e47" stroke-width="1"/>
  <ellipse cx="580" cy="600" rx="40" ry="12" fill="#292930" stroke="#3d3e47" stroke-width="1"/>
  <ellipse cx="570" cy="565" rx="35" ry="10" fill="#292930" stroke="#3d3e47" stroke-width="1"/>

  <!-- Family Home Main Mass -->
  <!-- Main Pitched Roof Gable (Center & Right) -->
  <polygon points="460,220 860,340 840,360 460,240 380,360 360,340" fill="#1a1a20" stroke="#2e2e38" stroke-width="2"/>
  <polygon points="400,345 460,240 820,345" fill="url(#h5Wall)"/>

  <!-- Master Bedroom Gable Window (A-frame architectural window) -->
  <polygon points="460,260 425,320 495,320" fill="url(#h5Glow)" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="460" y1="260" x2="460" y2="320" stroke="#18181c" stroke-width="2"/>

  <!-- Stone Accent Wall (Center-left) -->
  <rect x="360" y="340" width="260" height="220" rx="3" fill="url(#h5Stone)" stroke="#3a2e22" stroke-width="2"/>
  <!-- Stone texture lines -->
  <g stroke="#1f160e" stroke-width="1.2" opacity="0.6">
    <line x1="360" y1="380" x2="620" y2="380"/>
    <line x1="360" y1="420" x2="620" y2="420"/>
    <line x1="360" y1="460" x2="620" y2="460"/>
    <line x1="360" y1="500" x2="620" y2="500"/>
  </g>

  <!-- Living Room Wide Window on Stone Wall -->
  <rect x="390" y="400" width="140" height="110" rx="2" fill="url(#h5Glow)" stroke="#c4a574" stroke-width="1.5"/>
  <line x1="460" y1="400" x2="460" y2="510" stroke="#1c1610" stroke-width="2.5"/>

  <!-- Front Porch & Entrance Door -->
  <rect x="540" y="420" width="70" height="140" fill="#1e150f" stroke="#c4a574" stroke-width="1"/>
  <rect x="555" y="435" width="40" height="110" fill="#382517"/>
  <circle cx="590" cy="495" r="3" fill="#c4a574"/>
  <!-- Porch Downlight -->
  <polygon points="575,410 545,465 605,465" fill="#fff3d1" fill-opacity="0.25"/>

  <!-- Right Wing: Double Garage & Secondary Bedrooms -->
  <rect x="620" y="340" width="340" height="220" rx="3" fill="url(#h5Wall)" stroke="#33323b" stroke-width="2"/>

  <!-- Double Garage Automated Door (Portón Doble) -->
  <rect x="650" y="410" width="280" height="150" rx="3" fill="#1e1e24" stroke="#c4a574" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Sectional garage panels -->
  <line x1="655" y1="445" x2="925" y2="445" stroke="#363640" stroke-width="2"/>
  <line x1="655" y1="480" x2="925" y2="480" stroke="#363640" stroke-width="2"/>
  <line x1="655" y1="515" x2="925" y2="515" stroke="#363640" stroke-width="2"/>
  <!-- Top frosted glass inserts on garage -->
  <rect x="670" y="420" width="45" height="16" fill="url(#h5Glow)" fill-opacity="0.5"/>
  <rect x="735" y="420" width="45" height="16" fill="url(#h5Glow)" fill-opacity="0.5"/>
  <rect x="800" y="420" width="45" height="16" fill="url(#h5Glow)" fill-opacity="0.5"/>
  <rect x="865" y="420" width="45" height="16" fill="url(#h5Glow)" fill-opacity="0.5"/>

  <!-- Garage Driveway in Paved Asphalt/Stones -->
  <polygon points="630,560 950,560 1020,770 580,770" fill="#202127" stroke="#2d2f38" stroke-width="1"/>

  <!-- Landscaping: Front garden shrubs & ornamental grasses -->
  <path d="M280 560 C295 530 320 530 335 560" stroke="#324730" stroke-width="5" fill="none"/>
  <path d="M330 560 C345 520 375 520 390 560" stroke="#324730" stroke-width="5" fill="none"/>
  <path d="M960 560 C975 525 1005 525 1020 560" stroke="#324730" stroke-width="5" fill="none"/>

  <!-- Solar Garden Stake Lights along driveway -->
  <circle cx="610" cy="620" r="3" fill="#ffe7a8"/>
  <circle cx="610" cy="620" r="12" fill="#ffe7a8" fill-opacity="0.2"/>
  <circle cx="595" cy="690" r="3" fill="#ffe7a8"/>
  <circle cx="595" cy="690" r="12" fill="#ffe7a8" fill-opacity="0.2"/>

  <!-- Property Tag Badge -->
  <rect x="40" y="40" width="240" height="34" rx="17" fill="#1a1a1a" fill-opacity="0.85" stroke="#c4a574" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="58" cy="57" r="4.5" fill="#c4a574"/>
  <text x="74" y="62" fill="#f3efe6" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1">CASA · BARRIO EL MIRADOR</text>
</svg>
