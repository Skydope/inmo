<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="bg-cc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2e25"/>
      <stop offset="85%" stop-color="#141712"/>
      <stop offset="100%" stop-color="#0d0f0c"/>
    </radialGradient>
    <linearGradient id="gold-cc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e3"/>
      <stop offset="50%" stop-color="#cfb082"/>
      <stop offset="100%" stop-color="#937a54"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="64" fill="url(#bg-cc)"/>
  <circle cx="64" cy="64" r="58" stroke="url(#gold-cc)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Sun in horizon -->
  <circle cx="64" cy="46" r="14" fill="url(#gold-cc)" fill-opacity="0.25" stroke="url(#gold-cc)" stroke-width="1.2"/>
  
  <!-- Silhouette: Left countryside tree & furrows, Right urban skyline -->
  <!-- Horizon line -->
  <line x1="32" y1="68" x2="96" y2="68" stroke="url(#gold-cc)" stroke-width="1.5"/>
  
  <!-- Left Tree (Campo) -->
  <path d="M46 68V55M46 55C41 55 38 50 41 45C43 41 49 41 51 45C54 50 51 55 46 55Z" stroke="url(#gold-cc)" stroke-width="1.4" fill="url(#gold-cc)" fill-opacity="0.2"/>
  
  <!-- Furrows / lines under campo -->
  <path d="M34 76C44 73 54 73 64 76M36 82C46 79 56 79 66 82" stroke="url(#gold-cc)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Right City buildings (Ciudad) -->
  <rect x="68" y="44" width="9" height="24" rx="1" fill="url(#gold-cc)" fill-opacity="0.85"/>
  <rect x="79" y="36" width="10" height="32" rx="1" fill="url(#gold-cc)"/>
  <rect x="83" y="32" width="2" height="4" fill="url(#gold-cc)"/>
  <rect x="91" y="52" width="6" height="16" rx="1" fill="url(#gold-cc)" fill-opacity="0.7"/>

  <text x="64" y="104" fill="#cfb082" font-family="system-ui, sans-serif" font-weight="600" font-size="7.5" text-anchor="middle" letter-spacing="2">CAMPO &amp; CIUDAD</text>
  <text x="64" y="114" fill="#8f7b5c" font-family="system-ui, sans-serif" font-weight="500" font-size="6" text-anchor="middle" letter-spacing="1">PROPIEDADES</text>
</svg>
